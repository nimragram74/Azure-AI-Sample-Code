<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ShopEase – Login</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="auth-page">

  <div class="auth-container">
    <div class="auth-brand">
      <div class="brand-logo">🛒</div>
      <h1>ShopEase</h1>
      <p>Your one-stop shopping destination</p>
    </div>

    <div class="auth-card">
      <div class="tab-group">
        <button class="tab active" id="loginTab" onclick="switchTab('login')">Login</button>
        <button class="tab" id="registerTab" onclick="switchTab('register')">Register</button>
      </div>

      <!-- Login Form -->
      <form id="loginForm" class="auth-form" onsubmit="handleLogin(event)">
        <h2>Welcome Back</h2>
        <p class="form-subtitle">Sign in to your account</p>

        <div class="form-group">
          <label for="loginEmail">Email Address</label>
          <div class="input-wrapper">
            <span class="input-icon">✉️</span>
            <input type="email" id="loginEmail" placeholder="you@example.com" required />
          </div>
        </div>

        <div class="form-group">
          <label for="loginPassword">Password</label>
          <div class="input-wrapper">
            <span class="input-icon">🔒</span>
            <input type="password" id="loginPassword" placeholder="Enter your password" required />
            <button type="button" class="toggle-pw" onclick="togglePassword('loginPassword', this)">👁</button>
          </div>
        </div>

        <div class="form-row">
          <label class="checkbox-label">
            <input type="checkbox" id="rememberMe" />
            <span>Remember me</span>
          </label>
          <a href="#" class="forgot-link">Forgot password?</a>
        </div>

        <div id="loginError" class="error-msg hidden"></div>

        <button type="submit" class="btn-primary">Sign In</button>

        <div class="demo-hint">
          <strong>Demo credentials:</strong> demo@shopease.com / demo1234
        </div>
      </form>

      <!-- Register Form -->
      <form id="registerForm" class="auth-form hidden" onsubmit="handleRegister(event)">
        <h2>Create Account</h2>
        <p class="form-subtitle">Join thousands of happy shoppers</p>

        <div class="form-row two-col">
          <div class="form-group">
            <label for="firstName">First Name</label>
            <input type="text" id="firstName" placeholder="John" required />
          </div>
          <div class="form-group">
            <label for="lastName">Last Name</label>
            <input type="text" id="lastName" placeholder="Doe" required />
          </div>
        </div>

        <div class="form-group">
          <label for="regEmail">Email Address</label>
          <div class="input-wrapper">
            <span class="input-icon">✉️</span>
            <input type="email" id="regEmail" placeholder="you@example.com" required />
          </div>
        </div>

        <div class="form-group">
          <label for="regPassword">Password</label>
          <div class="input-wrapper">
            <span class="input-icon">🔒</span>
            <input type="password" id="regPassword" placeholder="Min. 8 characters" required minlength="8" />
            <button type="button" class="toggle-pw" onclick="togglePassword('regPassword', this)">👁</button>
          </div>
        </div>

        <div class="form-group">
          <label for="confirmPassword">Confirm Password</label>
          <div class="input-wrapper">
            <span class="input-icon">🔒</span>
            <input type="password" id="confirmPassword" placeholder="Repeat your password" required />
          </div>
        </div>

        <div class="form-group">
          <label class="checkbox-label">
            <input type="checkbox" id="agreeTerms" required />
            <span>I agree to the <a href="#">Terms & Conditions</a></span>
          </label>
        </div>

        <div id="registerError" class="error-msg hidden"></div>
        <div id="registerSuccess" class="success-msg hidden"></div>

        <button type="submit" class="btn-primary">Create Account</button>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
